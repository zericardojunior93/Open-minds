<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Minds | Entre na sua Conta</title>
    <link rel="icon" href="img/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajuste específico para a logo na página de login */
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            text-decoration: none;
        }
        .login-logo img {
            width: 50px;
        }
        .login-logo span {
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .google-auth-btn {
            width: 100%;
            margin-bottom: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: #fff;
            color: #14171a;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .google-auth-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 28px rgba(255, 255, 255, 0.12);
        }

        .google-auth-btn span:first-child {
            color: #4285f4;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .auth-divider {
            margin: 0 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--texto-secundario);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <main class="auth-section">
        <div id="auth-root"></div>
    </main>

    <!-- Scripts de Dados e Lógica -->
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>

    <!-- Carregando React e Babel Standalone via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="nexi-widget-v2.js"></script>

    <!-- CÓDIGO REACT LOGIN (Escrito em JSX!) -->
    <script type="text/babel">
        const { useState } = React;

        function AuthApp() {
            const [isLogin, setIsLogin] = useState(true);
            const [formData, setFormData] = useState({ nome: '', email: '', senha: '' });
            const [error, setError] = useState('');
            const redirectTarget = new URLSearchParams(window.location.search).get('redirect');

            const resolveRedirect = () => {
                if (redirectTarget === 'checkout') return 'compra.html';
                if (redirectTarget === 'home') return 'index.html';
                return 'aluno.html';
            };

            const handleInputChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
                setError('');
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (isLogin) {
                    const res = await window.auth.login(formData.email, formData.senha);
                    if (res.success) {
                        window.location.href = resolveRedirect();
                    } else {
                        setError(res.message);
                    }
                } else {
                    if (!formData.nome || !formData.email || !formData.senha) {
                        setError('Por favor, preencha todos os campos.');
                        return;
                    }
                    const res = await window.auth.cadastrar(formData.nome, formData.email, formData.senha);
                    if (res.success) {
                        window.location.href = resolveRedirect();
                    } else {
                        setError(res.message);
                    }
                }
            };

            const handleGoogleLogin = async () => {
                setError('');
                const res = await window.auth.loginComGoogle();

                if (res.success) {
                    window.location.href = resolveRedirect();
                } else {
                    setError(res.message);
                }
            };


            return (
                <div className="auth-card">
                    <a href="index.html" className="login-logo">
                        <img src="img/logo.png" alt="Open Minds Logo" />
                        <span>Open Minds</span>
                    </a>

                    <div className="auth-header">
                        <h1>{isLogin ? 'Bem-vindo de volta' : 'Crie sua conta'}</h1>
                        <p>{isLogin ? 'Entre com seu e-mail para continuar' : 'Comece sua jornada tecnológica hoje'}</p>
                    </div>

                    {error && <div className="auth-error">{error}</div>}

                    {isLogin && (
                        <>
                            <button type="button" className="google-auth-btn" onClick={handleGoogleLogin}>
                                <span>G</span>
                                <span>Entrar com Google</span>
                            </button>
                            <div className="auth-divider">ou</div>
                        </>
                    )}

                    <form className="auth-form" onSubmit={handleSubmit}>
                        {!isLogin && (
                            <div className="form-group">
                                <label>Nome Completo</label>
                                <input 
                                    type="text" 
                                    name="nome" 
                                    placeholder="Como quer ser chamado?" 
                                    value={formData.nome}
                                    onChange={handleInputChange}
                                />
                            </div>
                        )}
                        <div className="form-group">
                            <label>E-mail</label>
                            <input 
                                type="email" 
                                name="email" 
                                placeholder="seu@email.com" 
                                required 
                                value={formData.email}
                                onChange={handleInputChange}
                            />
                        </div>
                        <div className="form-group">
                            <label>Senha</label>
                            <input 
                                type="password" 
                                name="senha" 
                                placeholder="••••••••" 
                                required 
                                value={formData.senha}
                                onChange={handleInputChange}
                            />
                        </div>

                        <button type="submit" className="auth-btn">
                            {isLogin ? 'Entrar' : 'Cadastrar agora'}
                        </button>
                    </form>

                    <div className="auth-switch">
                        {isLogin ? (
                            <>Não tem uma conta? <span onClick={() => window.location.href = 'planos.html'}>Cadastre-se</span></>
                        ) : (
                            <>Já possui uma conta? <span onClick={() => setIsLogin(true)}>Faça Login</span></>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('auth-root'));
        root.render(<AuthApp />);
    </script>
</body>
</html>
